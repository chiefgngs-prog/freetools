<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Bio Generator - Write Professional Bios Instantly</title>
<meta name="description" content="Free AI bio generator. Create professional bios for LinkedIn, Twitter, Instagram, resumes, and more. No signup.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a12;--surface:#13131f;--surface2:#1c1c2e;--primary:#6c5ce7;--accent:#00d4aa;--hot:#e94560;--text:#e0e0e8;--text-dim:#888;--border:#252538}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.header{text-align:center;padding:48px 20px 20px}
.header h1{font-size:clamp(28px,5vw,42px);font-weight:800}
.header h1 span{background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--text-dim);max-width:500px;margin:8px auto 0}
.container{max-width:700px;margin:0 auto;padding:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;margin-top:12px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
.btn{padding:14px 28px;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:16px}
.btn-go{background:linear-gradient(135deg,var(--primary),var(--hot));color:#fff}
.output{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:20px;margin-top:16px;min-height:60px;white-space:pre-wrap;font-size:14px;position:relative}
.copy-btn{position:absolute;top:8px;right:8px;padding:6px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);cursor:pointer;font-size:12px}
.bio-option{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:8px;position:relative}
.bio-option h4{color:var(--accent);font-size:13px;margin-bottom:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);padding:12px 24px;background:var(--accent);color:#000;border-radius:8px;font-weight:600;z-index:999;opacity:0;transition:all .3s}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.promo{text-align:center;background:linear-gradient(135deg,rgba(233,69,96,0.1),rgba(108,92,231,0.1));border:1px solid rgba(233,69,96,0.3);border-radius:12px;padding:20px;margin-top:20px}
.promo a{display:inline-block;padding:12px 28px;background:var(--hot);color:#fff;border-radius:8px;text-decoration:none;font-weight:700;margin-top:8px}
footer{text-align:center;padding:32px 20px;color:#444;font-size:13px}
footer a{color:var(--primary);text-decoration:none}
</style>
</head>
<body>
<div class="header">
<h1>AI Bio <span>Generator</span></h1>
<p>Generate professional bios for any platform in seconds. Free, no signup.</p>
</div>
<div class="container">
<div class="card">
<label>Your name</label>
<input type="text" id="name" placeholder="John Smith">
<label>Your job / role</label>
<input type="text" id="role" placeholder="Software Engineer">
<label>Key skills or achievements</label>
<textarea id="skills" rows="2" placeholder="10 years experience, led teams of 20, built 3 SaaS products"></textarea>
<label>Platform</label>
<select id="platform">
<option value="linkedin">LinkedIn About section</option>
<option value="twitter">Twitter / X bio</option>
<option value="instagram">Instagram bio</option>
<option value="resume">Resume summary</option>
<option value="website">Website about page</option>
<option value="speaker">Speaker bio</option>
</select>
<label>Tone</label>
<select id="tone">
<option value="professional">Professional</option>
<option value="casual">Casual / friendly</option>
<option value="confident">Confident / bold</option>
<option value="creative">Creative / quirky</option>
</select>
<button class="btn btn-go" onclick="generate()">Generate Bios</button>
</div>
<div class="card">
<div id="output"></div>
</div>
<div class="promo">
<p>Want 207 AI prompts for business, marketing, sales?</p>
<a href="https://kyleqarbour-dot.github.io/aipromptvault/">Get the AI Prompt Vault</a>
</div>
</div>
<footer><p><a href="https://kyleqarbour-dot.github.io/freetools/">More Free Tools</a></p></footer>
<div class="toast" id="toast">Copied!</div>
<script>
function generate(){
var n=document.getElementById("name").value.trim();
var r=document.getElementById("role").value.trim();
var s=document.getElementById("skills").value.trim();
var p=document.getElementById("platform").value;
var t=document.getElementById("tone").value;
if(!n||!r){alert("Please enter your name and role");return;}
var bios=[];
var toneMap={professional:"passionate",casual:"pretty pumped",confident:"obsessed",creative:"weirdly excited"};
var prefixMap={professional:"Experienced",casual:"Hey, I'm",confident:"I'm a",creative:"Professional"};
if(p=="twitter"){
bios.push(n+" | "+r+". "+(s?s.split(",")[0]:"")+" Building things that matter.");
bios.push(r+" & builder. "+(s?s.split(",")[0]+". ":"")+"Sharing what I learn.");
bios.push(prefixMap[t]+" "+r.toLowerCase()+". "+(s?s.split(",")[0]+". ":"")+"Coffee + code.");
}else if(p=="linkedin"){
bios.push("I'm a "+r+" with a passion for excellence. "+(s?s:"")+" My mission is to create meaningful impact through my work and help organizations achieve their goals. Let's connect!");
bios.push("As a "+r+", I believe in the power of "+(s?s.split(",")[0].toLowerCase():"innovation")+". "+(s?s:"")+" Always learning, always growing, always looking for the next challenge.");
bios.push(prefixMap[t]+" "+r+" "+toneMap[t]+" about "+(s?s.split(",")[0].toLowerCase():"my work")+". "+(s?s:"")+" I help teams turn ideas into reality.");
}else if(p=="instagram"){
bios.push(r+" \uD83D\uDE80\n"+(s?s.split(",")[0]:"Creating & building")+"\n\u2615 | \uD83C\uDFAF | \u2728");
bios.push(n+" | "+r+"\n"+(s?s.split(",")[0]:"Living the dream")+"\n\uD83D\uDC47 link below");
}else if(p=="resume"){
bios.push(r+" with "+(s?s.split(",")[0]+". ":"")+" Proven track record of driving results and leading high-performing teams. Passionate about "+(s?s.split(",")[1]?s.split(",")[1].toLowerCase():s.split(",")[0].toLowerCase():"innovation")+" and continuous improvement.");
}else if(p=="website"){
bios.push("Hi, I'm "+n+", a "+r+" "+toneMap[t]+" about building products people love. "+(s?s:"")+" Welcome to my corner of the internet.");
}else{
bios.push(n+" is a "+r+" whose work focuses on "+(s?s.split(",")[0].toLowerCase():"innovation and excellence")+". "+(s?s:"")+" With a commitment to pushing boundaries, "+n.split(" ")[0]+" brings fresh perspectives to every project.");
}
var out=document.getElementById("output");
var html="";
bios.forEach(function(bio,i){
html+='<div class="bio-option"><h4>Option '+(i+1)+'</h4>'+bio+'<button class="copy-btn" onclick="copyText(this,\''+bio.replace(/'/g,"\\'")+'\')">Copy</button></div>';
});
out.innerHTML=html;
}
function copyText(btn,text){
navigator.clipboard.writeText(text).then(function(){
var t=document.getElementById("toast");t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2000);
});
}
</script>
</body>
</html>
