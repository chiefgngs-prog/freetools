<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regex Tester - Free Online Regular Expression Tester | Free Tools</title>
<meta name="description" content="Free online regex tester. Test JavaScript regular expressions with flags and see highlighted matches plus every capture group in real time.">
<style>
:root{--bg:#0a0a12;--surface:#13131f;--primary:#6c5ce7;--accent:#00d4aa;--text:#e0e0e8;--text-dim:#8888a0;--border:#252538}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.container{max-width:820px;width:100%}
h1{text-align:center;font-size:2rem;margin-bottom:8px;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:var(--text-dim);margin-bottom:24px;font-size:.9rem}
label{display:block;font-size:.85rem;color:var(--text-dim);margin:14px 0 6px}
input,textarea{width:100%;background:var(--surface);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;padding:12px 14px;outline:none;font-family:inherit}
textarea{height:140px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{border-color:var(--primary)}
.flags{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
.flag{display:flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer}
.flag input{width:auto}
.err{margin-top:12px;background:#3a1620;border:1px solid #8b2030;color:#ff9aa8;padding:10px 14px;border-radius:10px;font-size:.9rem;display:none}
.block{margin-top:20px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
.block h3{font-size:.95rem;color:var(--text-dim);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.count{color:var(--accent);font-weight:600}
#highlight{white-space:pre-wrap;word-break:break-word;font-family:'Consolas',monospace;font-size:.95rem;line-height:1.7;min-height:2em}
mark{background:var(--accent);color:#000;border-radius:3px}
.matches{display:flex;flex-direction:column;gap:8px}
.match{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.9rem}
.match-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.midx{color:var(--primary);font-weight:700}
.mat{color:var(--text-dim);font-size:.8rem}
code{font-family:'Consolas',monospace;background:var(--bg);padding:1px 5px;border-radius:4px;color:var(--accent)}
.group{margin-top:4px;margin-left:8px;font-size:.85rem;color:var(--text-dim)}
.glabel{color:var(--primary)}
.empty{color:var(--text-dim);font-size:.9rem}
footer{text-align:center;color:var(--text-dim);margin-top:28px;font-size:.85rem}
footer a{color:var(--accent);text-decoration:none;display:block;margin:4px 0}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--accent);color:#000;padding:14px 28px;border-radius:12px;font-weight:600;transition:transform .3s;z-index:100}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="container">
<h1>🔍 Regex Tester</h1>
<p class="subtitle">Test JavaScript regular expressions live — see highlighted matches and every capture group.</p>

<label for="pattern">Regular Expression</label>
<input id="pattern" type="text" value="\b(\w+)@(\w+)\.(\w+)\b" oninput="run()">

<label>Flags</label>
<div class="flags">
<label class="flag"><input type="checkbox" id="f-g" checked onchange="run()"> g (global)</label>
<label class="flag"><input type="checkbox" id="f-i" onchange="run()"> i (case-insensitive)</label>
<label class="flag"><input type="checkbox" id="f-m" onchange="run()"> m (multiline)</label>
<label class="flag"><input type="checkbox" id="f-s" onchange="run()"> s (dotall)</label>
<label class="flag"><input type="checkbox" id="f-u" onchange="run()"> u (unicode)</label>
<label class="flag"><input type="checkbox" id="f-y" onchange="run()"> y (sticky)</label>
</div>

<div class="err" id="err"></div>

<label for="text" style="margin-top:16px">Test String</label>
<textarea id="text" placeholder="Paste the text to search here…" oninput="run()">Contact me at alice@example.com or bob@test.org for details.</textarea>

<div class="block">
<h3>Highlighted Matches</h3>
<div id="highlight"></div>
</div>

<div class="block">
<h3>Match Details <span class="count"><span id="count">0</span> matches</span></h3>
<div class="matches" id="matches"></div>
</div>

<footer>
<a href="https://chiefgngs-prog.github.io/freetools/">← More Free Tools</a>
<a href="https://chiefgngs-prog.github.io/promptvault/">AI Prompt Vault →</a>
</footer>
</div>
<div class="toast" id="toast"></div>

<script>
function $(id){return document.getElementById(id)}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function flags(){let f='';['g','i','m','s','u','y'].forEach(x=>{if($('f-'+x).checked)f+=x});return f}
function run(){
  const pattern=$('pattern').value;
  const str=$('text').value;
  const fl=flags();
  const errEl=$('err');
  let re;
  try{re=new RegExp(pattern,fl)}catch(e){errEl.textContent='⚠ Invalid regex: '+e.message;errEl.style.display='block';$('highlight').textContent='';$('matches').innerHTML='';$('count').textContent=0;return}
  errEl.style.display='none';
  const matches=[];
  if(fl.includes('g')){
    let m;
    while((m=re.exec(str))!==null){
      matches.push({m:m[0],index:m.index,groups:m.slice(1)});
      if(m[0]==='')re.lastIndex++; // ponytail: guard against zero-width-match infinite loop
    }
  }else{
    const m=re.exec(str);
    if(m)matches.push({m:m[0],index:m.index,groups:m.slice(1)});
  }
  let html='',last=0;
  matches.forEach(mt=>{
    html+=esc(str.slice(last,mt.index))+'<mark>'+esc(mt.m)+'</mark>';
    last=mt.index+mt.m.length;
  });
  html+=esc(str.slice(last));
  $('highlight').innerHTML=html||'<span class="empty">Type a pattern and test string above.</span>';
  $('count').textContent=matches.length;
  const mEl=$('matches');
  if(!matches.length){mEl.innerHTML='<div class="empty">No matches found.</div>';return}
  mEl.innerHTML=matches.map((mt,i)=>{
    const g=mt.groups.map((gv,gi)=>gv!==undefined?'<div class="group"><span class="glabel">Group '+(gi+1)+':</span> <code>'+esc(gv)+'</code></div>':'').join('');
    return '<div class="match"><div class="match-head"><span class="midx">#'+(i+1)+'</span><code>'+(esc(mt.m)||'<em>(empty match)</em>')+'</code><span class="mat">@ index '+mt.index+'</span></div>'+g+'</div>';
  }).join('');
}
run();
</script>
</body>
</html>
