<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Logo Maker - Create a Logo in Seconds (Free)</title>
<meta name="description" content="Free AI logo maker. Enter your business name and generate a professional logo instantly. No signup.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a12;--surface:#13131f;--primary:#6c5ce7;--accent:#00d4aa;--hot:#e94560;--text:#e0e0e8;--text-dim:#888;--border:#252538}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.header{text-align:center;padding:48px 20px 20px}
.header h1{font-size:clamp(28px,5vw,42px);font-weight:800}
.header h1 span{background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--text-dim);max-width:500px;margin:8px auto 0}
.container{max-width:700px;margin:0 auto;padding:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px}
input,select{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.btn{padding:14px 28px;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:12px}
.btn-go{background:linear-gradient(135deg,var(--primary),var(--hot));color:#fff}
.logos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:16px}
.logo-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all .2s}
.logo-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.logo-preview{width:80px;height:80px;margin:0 auto 8px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff}
.logo-name{font-size:14px;font-weight:600}
.logo-tag{font-size:11px;color:var(--text-dim)}
.download-btn{margin-top:8px;padding:6px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);cursor:pointer;font-size:12px;width:100%}
.promo{text-align:center;background:linear-gradient(135deg,rgba(233,69,96,0.1),rgba(108,92,231,0.1));border:1px solid rgba(233,69,96,0.3);border-radius:12px;padding:20px;margin-top:20px}
.promo a{display:inline-block;padding:12px 28px;background:var(--hot);color:#fff;border-radius:8px;text-decoration:none;font-weight:700;margin-top:8px}
footer{text-align:center;padding:32px 20px;color:#444;font-size:13px}
footer a{color:var(--primary);text-decoration:none}
</style>
</head>
<body>
<div class="header">
<h1>AI Logo <span>Maker</span></h1>
<p>Generate professional logos instantly. Free, no signup.</p>
</div>
<div class="container">
<div class="card">
<label>Business Name</label>
<input type="text" id="bizname" placeholder="e.g., Acme Corp, Coffee Lab, FitPro">
<label>Industry</label>
<select id="industry">
<option value="tech">Tech / Software</option>
<option value="food">Food / Restaurant</option>
<option value="fitness">Fitness / Health</option>
<option value="finance">Finance / Business</option>
<option value="creative">Creative / Design</option>
<option value="retail">Retail / E-commerce</option>
</select>
<label>Style</label>
<select id="logostyle">
<option value="gradient">Gradient</option>
<option value="minimal">Minimal</option>
<option value="bold">Bold</option>
<option value="elegant">Elegant</option>
</select>
<button class="btn btn-go" onclick="generate()">Generate Logos</button>
</div>
<div class="card" id="results" style="display:none">
<div class="logos" id="logos"></div>
</div>
<div class="promo">
<p>Build a full website for your business with AI</p>
<a href="https://chiefgngs-prog.github.io/freetools/website-builder/">Try AI Website Builder</a>
</div>
</div>
<footer><p><a href="https://chiefgngs-prog.github.io/freetools/">More Free Tools</a></p></footer>
<script>
var palettes={tech:["#6c5ce7","#00d4aa","#0984e3","#e94560","#00cec9"],food:["#e17055","#fdcb6e","#d63031","#00b894","#fd79a8"],fitness:["#e94560","#00d4aa","#6c5ce7","#f39c12","#e74c3c"],finance:["#2d3436","#0984e3","#636e72","#2c3e50","#27ae60"],creative:["#e84393","#6c5ce7","#fd79a8","#00cec9","#fdcb6e"],retail:["#e17055","#00b894","#6c5ce7","#fdcb6e","#e84393"]};
var icons={tech:["/","<",">","{","}","#","@","*","&","+"],food:["","","","","","","","","☕",""],fitness:["","","","","","","","","⚡",""],finance:["$","","","","%","","","","",""],creative:["","","","","","","","","",""],retail:["","","","","","","","","",""]};
var fonts={gradient:"'Segoe UI',sans-serif",minimal:"'Helvetica Neue',sans-serif",bold:"'Impact',sans-serif",elegant:"'Georgia',serif"};
function generate(){
var name=document.getElementById("bizname").value.trim();
var industry=document.getElementById("industry").value;
var style=document.getElementById("logostyle").value;
if(!name){alert("Enter your business name!");return;}
var colors=palettes[industry]||palettes.tech;
var iconSet=icons[industry]||icons.tech;
var initials=name.replace(/[^A-Za-z0-9]/g,"").substring(0,2).toUpperCase();
var html="";
for(var i=0;i<9;i++){
var color=colors[i%colors.length];
var icon=iconSet[i%iconSet.length];
var grad="linear-gradient(135deg,"+color+","+colors[(i+2)%colors.length]+")";
var bg=style==="gradient"?grad:color;
var display=style==="minimal"?initials:(icon||initials);
var fontSize=style==="bold"?"32px":"24px";
var fontWeight=style==="elegant"?"400":"800";
var fontFamily=fonts[style];
html+='<div class="logo-card"><div class="logo-preview" style="background:'+bg+';font-size:'+fontSize+';font-weight:'+fontWeight+';font-family:'+fontFamily+'">'+display+'</div><div class="logo-name">'+name+'</div><div class="logo-tag">'+style.charAt(0).toUpperCase()+style.slice(1)+'</div><button class="download-btn" onclick="downloadLogo(this)">Download SVG</button></div>';
}
document.getElementById("logos").innerHTML=html;
document.getElementById("results").style.display="block";
}
function downloadLogo(btn){
var card=btn.parentElement;
var preview=card.querySelector(".logo-preview");
var name=card.querySelector(".logo-name").textContent;
var bg=preview.style.background;
var content=preview.textContent;
var fontSize=preview.style.fontSize||"24px";
var fontWeight=preview.style.fontWeight||"800";
var svg='<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" rx="24" fill="'+bg+'"/><text x="100" y="115" text-anchor="middle" fill="white" font-size="'+fontSize+'" font-family="sans-serif" font-weight="'+fontWeight+'">'+content+'</text></svg>';
var blob=new Blob([svg],{type:"image/svg+xml"});
var a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=name.replace(/[^a-z0-9]/gi,"_").toLowerCase()+"_logo.svg";
a.click();
}
</script>
</body>
</html>
