<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO Checklist - 50+ Point SEO Audit Tool | Free Tools</title>
<meta name="description" content="Free interactive SEO checklist with 50+ audit points. Technical SEO, on-page, content, and link building. Track your progress and improve rankings.">
<style>
:root{--bg:#0f0f1e;--surface:#1a1a2e;--primary:#6c5ce7;--accent:#00d4aa;--text:#e0e0e0;--text-dim:#8888aa;--border:#2a2a4a;--success:#2ecc71;--warning:#f39c12;--danger:#e74c3c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
.header{background:linear-gradient(135deg,rgba(108,92,231,0.15),rgba(0,212,170,0.1));border-bottom:1px solid var(--border);padding:40px 20px;text-align:center}
.header h1{font-size:2rem;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.header p{color:var(--text-dim);max-width:600px;margin:0 auto}
.progress-bar-wrap{max-width:600px;margin:20px auto 0;height:12px;background:var(--surface);border-radius:6px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:6px;transition:width 0.3s;width:0%}
.progress-text{text-align:center;margin-top:8px;font-size:0.9rem;color:var(--text-dim)}
.container{max-width:800px;margin:0 auto;padding:20px}
.section{margin-bottom:32px}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.section-icon{font-size:1.5rem}
.section-title{font-size:1.2rem;color:var(--accent)}
.section-count{font-size:0.8rem;color:var(--text-dim);margin-left:auto}
.checklist-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;transition:all 0.2s}
.checklist-item:hover{border-color:var(--primary)}
.checklist-item.done{opacity:0.5}
.checklist-item.done .item-text{text-decoration:line-through}
.checkbox{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;margin-top:2px}
.checkbox.checked{background:var(--success);border-color:var(--success)}
.checkbox.checked::after{content:'✓';color:#fff;font-weight:bold;font-size:14px}
.item-content{flex:1}
.item-title{font-size:0.9rem;font-weight:600;margin-bottom:2px}
.item-desc{font-size:0.8rem;color:var(--text-dim);line-height:1.4}
.item-priority{display:inline-block;padding:1px 8px;border-radius:8px;font-size:0.68rem;font-weight:600;margin-left:8px}
.priority-high{background:rgba(231,76,60,0.2);color:var(--danger)}
.priority-medium{background:rgba(243,156,18,0.2);color:var(--warning)}
.priority-low{background:rgba(46,204,113,0.2);color:var(--success)}
.cta{text-align:center;padding:40px 20px;background:var(--surface);border-top:1px solid var(--border)}
.cta a{color:var(--accent);text-decoration:none;font-weight:600}
footer{text-align:center;padding:20px;color:var(--text-dim);font-size:0.8rem}
.toolbar{display:flex;gap:8px;justify-content:center;margin:20px 0}
button{cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 16px;font-size:0.85rem;transition:0.2s}
button:hover{border-color:var(--accent)}
</style>
</head>
<body>

<div class="header">
<h1>✅ SEO Audit Checklist</h1>
<p>50+ point SEO checklist covering technical, on-page, content, and link building. Check items off as you complete them.</p>
<div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill"></div></div>
<div class="progress-text" id="progressText">0 of 0 completed</div>
</div>

<div class="toolbar">
<button onclick="reset()">↺ Reset All</button>
<button onclick="exportResults()">📋 Export Results</button>
</div>

<div class="container" id="container"></div>

<div class="cta">
<p>🚀 Get <strong>503 AI prompts</strong> including 20 SEO-specific prompts</p>
<p style="margin-top:8px"><a href="https://chiefgngs-prog.github.io/promptvault/">Get the AI Prompt Vault →</a></p>
</div>

<footer>© 2026 AI Prompt Vault · <a href="https://chiefgngs-prog.github.io/freetools/" style="color:var(--text-dim)">Free Tools</a></footer>

<script>
const checklist={
"Technical SEO":[
{title:"Set up Google Search Console",desc:"Verify your site ownership in GSC to monitor indexing, clicks, and impressions.",priority:"high"},
{title:"Submit XML Sitemap",desc:"Create and submit sitemap.xml to Google Search Console and Bing Webmaster Tools.",priority:"high"},
{title:"Create robots.txt",desc:"Ensure robots.txt allows crawling of important pages and blocks admin/duplicate pages.",priority:"high"},
{title:"Enable HTTPS",desc:"Install SSL certificate. Google prioritizes HTTPS sites in rankings.",priority:"high"},
{title:"Check mobile-friendliness",desc:"Use Google's Mobile-Friendly Test. Mobile-first indexing is now default.",priority:"high"},
{title:"Optimize Core Web Vitals",desc:"Target: LCP < 2.5s, FID < 100ms, CLS < 0.1. Check via PageSpeed Insights.",priority:"high"},
{title:"Fix broken links (404s)",desc:"Find and fix internal and external broken links. Use Screaming Frog or Ahrefs.",priority:"medium"},
{title:"Implement canonical tags",desc:"Add rel=canonical to prevent duplicate content issues.",priority:"medium"},
{title:"Set up hreflang tags",desc:"If multilingual, implement hreflang for international SEO.",priority:"low"},
{title:"Optimize page speed",desc:"Compress images, minify CSS/JS, enable caching, use CDN. Target < 3s load time.",priority:"high"},
{title:"Create custom 404 page",desc:"Design a helpful 404 page with navigation links and search.",priority:"low"},
{title:"Set up 301 redirects",desc:"Redirect old URLs to new ones. Never leave redirected pages without a 301.",priority:"medium"},
{title:"Enable structured data",desc:"Add schema markup (Organization, LocalBusiness, Product, FAQ, etc.) for rich results.",priority:"high"},
],
"On-Page SEO":[
{title:"Optimize title tags",desc:"Each page: unique title, < 60 chars, includes primary keyword near the start.",priority:"high"},
{title:"Write meta descriptions",desc:"Unique, < 155 chars, includes keyword and CTA. Not a ranking factor but affects CTR.",priority:"high"},
{title:"Optimize H1 tags",desc:"One H1 per page, includes primary keyword, descriptive.",priority:"high"},
{title:"Use proper heading hierarchy",desc:"H1 > H2 > H3 in logical order. Don't skip levels.",priority:"medium"},
{title:"Optimize URL structure",desc:"Short, descriptive, keyword-rich, hyphen-separated. No dates or categories.",priority:"medium"},
{title:"Add internal links",desc:"Link to related pages with descriptive anchor text. Aim for 3-5 internal links per page.",priority:"high"},
{title:"Optimize images",desc:"Descriptive filenames, alt text with keywords, compressed file size, lazy loading.",priority:"high"},
{title:"Check keyword density",desc:"Primary keyword: 1-2% density. Don't keyword stuff. Use LSI keywords naturally.",priority:"medium"},
{title:"Optimize for featured snippets",desc:"Answer questions concisely (40-60 words), use lists and tables, target question queries.",priority:"medium"},
{title:"Add breadcrumb navigation",desc:"Implement breadcrumbs with schema markup for better UX and SEO.",priority:"low"},
],
"Content SEO":[
{title:"Conduct keyword research",desc:"Find keywords with decent volume and low competition. Map keywords to pages.",priority:"high"},
{title:"Create topic clusters",desc:"Build pillar pages with supporting cluster content linked together.",priority:"high"},
{title:"Write comprehensive content",desc:"Aim for depth. Cover the topic thoroughly. Longer content (1500+ words) tends to rank better.",priority:"high"},
{title:"Match search intent",desc:"Analyze page 1 results for your keyword. Match the format (guide, list, tool, etc.).",priority:"high"},
{title:"Update old content",desc:"Refresh outdated posts. Update stats, add new sections, fix broken links.",priority:"medium"},
{title:"Create an FAQ section",desc:"Answer common questions with FAQ schema markup for rich results.",priority:"medium"},
{title:"Write compelling intros",desc:"Hook readers in the first 2 sentences. High bounce rate hurts rankings.",priority:"medium"},
{title:"Use LSI keywords",desc:"Include related terms and synonyms naturally throughout content.",priority:"medium"},
{title:"Add a table of contents",desc:"For long articles, add jump links. Google may use them in search results.",priority:"low"},
{title:"Create evergreen content",desc:"Build content that stays relevant long-term. Update periodically.",priority:"medium"},
],
"Link Building":[
{title:"Build a backlink profile",desc:"Aim for quality over quantity. Links from authoritative sites in your niche.",priority:"high"},
{title:"Create linkable assets",desc:"Publish original research, tools, infographics, or comprehensive guides that naturally attract links.",priority:"high"},
{title:"Do guest posting",desc:"Write guest posts on relevant blogs. Focus on quality sites, not spammy ones.",priority:"medium"},
{title:"Build citations/local links",desc:"For local businesses, get listed in directories and local publications.",priority:"medium"},
{title:"Reclaim broken backlinks",desc:"Find sites linking to your 404 pages and ask them to update the link.",priority:"medium"},
{title:"Monitor competitor backlinks",desc:"Find where competitors get links. Target the same opportunities.",priority:"medium"},
{title:"Create an internal linking strategy",desc:"Link new content to old, and old to new. Spread link equity throughout your site.",priority:"high"},
{title:"Submit to relevant directories",desc:"Get listed in industry-specific directories and resource pages.",priority:"low"},
],
"Local SEO":[
{title:"Claim Google Business Profile",desc:"Complete every field. Add photos, hours, services. Post regularly.",priority:"high"},
{title:"Get customer reviews",desc:"Ask happy customers for reviews. Respond to all reviews (positive and negative).",priority:"high"},
{title:"Ensure NAP consistency",desc:"Name, Address, Phone must be identical across all online listings.",priority:"high"},
{title:"Build local citations",desc:"Get listed on Yelp, Yellow Pages, Apple Maps, Bing Places, and niche directories.",priority:"medium"},
{title:"Create location pages",desc:"If multi-location, create unique pages for each location.",priority:"medium"},
{title:"Optimize for local keywords",desc:"Include city/neighborhood in title tags, content, and meta descriptions.",priority:"high"},
],
"Tracking & Analytics":[
{title:"Set up Google Analytics 4",desc:"Track user behavior, traffic sources, conversions, and audience insights.",priority:"high"},
{title:"Set up conversion tracking",desc:"Define and track key actions: form submissions, purchases, signups.",priority:"high"},
{title:"Monitor keyword rankings",desc:"Track positions for target keywords. Use GSC, Ahrefs, or SEMrush.",priority:"medium"},
{title:"Monitor backlinks",desc:"Track new and lost backlinks monthly. Disavow toxic links.",priority:"medium"},
{title:"Set up alerts",desc:"Google Alerts for brand mentions, GSC alerts for indexing issues.",priority:"low"},
{title:"Create a monthly SEO report",desc:"Track traffic, rankings, backlinks, conversions, and Core Web Vitals.",priority:"medium"},
]
};

const container=document.getElementById('container');
let totalItems=0;
let checkedItems=0;
const itemStates={};

Object.entries(checklist).forEach(([section,items])=>{
totalItems+=items.length;
let sectionHtml=`<div class="section"><div class="section-header"><span class="section-icon">`;
const icons={"Technical SEO":"⚙️","On-Page SEO":"📄","Content SEO":"✍️","Link Building":"🔗","Local SEO":"📍","Tracking & Analytics":"📊"};
sectionHtml+=icons[section]||"📋";
sectionHtml+=`</span><h2 class="section-title">${section}</h2><span class="section-count">${items.length} items</span></div>`;
items.forEach((item,idx)=>{
const id=`${section}-${idx}`;
itemStates[id]=false;
sectionHtml+=`<div class="checklist-item" id="item-${id}">
<div class="checkbox" onclick="toggle('${id}')"></div>
<div class="item-content">
<div class="item-title">${item.title}<span class="item-priority priority-${item.priority}">${item.priority}</span></div>
<div class="item-desc">${item.desc}</div>
</div></div>`;
});
sectionHtml+='</div>';
container.insertAdjacentHTML('beforeend',sectionHtml);
});

function toggle(id){
itemStates[id]=!itemStates[id];
const checkbox=document.querySelector(`#item-${id} .checkbox`);
const item=document.getElementById(`item-${id}`);
if(itemStates[id]){
checkbox.classList.add('checked');
item.classList.add('done');
checkedItems++;
}else{
checkbox.classList.remove('checked');
item.classList.remove('done');
checkedItems--;
}
updateProgress();
}

function updateProgress(){
const pct=totalItems>0?(checkedItems/totalItems*100):0;
document.getElementById('progressFill').style.width=pct+'%';
document.getElementById('progressText').textContent=`${checkedItems} of ${totalItems} completed (${pct.toFixed(0)}%)`;
}

function reset(){
Object.keys(itemStates).forEach(id=>{
itemStates[id]=false;
document.querySelector(`#item-${id} .checkbox`).classList.remove('checked');
document.getElementById(`item-${id}`).classList.remove('done');
});
checkedItems=0;
updateProgress();
}

function exportResults(){
const done=Object.entries(itemStates).filter(([k,v])=>v).map(([k])=>k);
const pct=(checkedItems/totalItems*100).toFixed(0);
let text=`SEO AUDIT RESULTS\n${checkedItems}/${totalItems} items completed (${pct}%)\n\n`;
text+=`COMPLETED:\n`;
Object.entries(checklist).forEach(([section,items])=>{
items.forEach((item,idx)=>{
const id=`${section}-${idx}`;
if(itemStates[id])text+=`  [x] ${item.title}\n`;
});
});
text+=`\nREMAINING:\n`;
Object.entries(checklist).forEach(([section,items])=>{
items.forEach((item,idx)=>{
const id=`${section}-${idx}`;
if(!itemStates[id])text+=`  [ ] ${item.title}\n`;
});
});
navigator.clipboard.writeText(text);
showToast('Results copied to clipboard!');
}

function showToast(msg){
const t=document.getElementById('toast')||document.createElement('div');
t.id='toast';t.className='toast';t.textContent=msg;
t.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--accent);color:#000;padding:14px 28px;border-radius:12px;font-weight:600;transition:transform 0.3s;z-index:100';
document.body.appendChild(t);
setTimeout(()=>t.classList.add('show'),10);
setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},2000);
}

updateProgress();
</script>
</body>
</html>
