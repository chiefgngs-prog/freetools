<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Docs Generator - Privacy Policy & Terms of Service</title>
<meta name="description" content="Generate privacy policy, terms of service, and disclaimer for your website or app. Free, no signup.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a12;--surface:#13131f;--surface2:#1c1c2e;--primary:#6c5ce7;--accent:#00d4aa;--text:#e0e0e8;--text-dim:#7a7a8c;--border:#252538;--radius:12px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.layout{display:flex;min-height:100vh}
.form-side{width:420px;padding:24px;overflow-y:auto;border-right:1px solid var(--border);height:100vh;position:sticky;top:0}
.form-side h1{font-size:20px;margin-bottom:4px}
.form-side p{color:var(--text-dim);font-size:13px;margin-bottom:20px}
.tabs{display:flex;gap:4px;margin-bottom:20px}
.tab{flex:1;padding:10px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-dim);transition:all .2s}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.checkbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checkbox-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px;background:var(--surface);border-radius:8px;cursor:pointer}
.checkbox-item input{width:auto}
.btn{padding:12px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:8px}
.btn-green{background:var(--accent);color:#000}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.preview-side{flex:1;padding:32px;overflow-y:auto}
.preview-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.preview-header h2{font-size:18px}
.preview-actions{display:flex;gap:8px}
.btn-sm{padding:8px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.doc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:40px;line-height:1.8;font-size:14px;color:var(--text)}
.doc h1{font-size:28px;margin-bottom:8px;color:#fff}
.doc h2{font-size:18px;margin-top:24px;margin-bottom:8px;color:var(--accent)}
.doc p{margin-bottom:12px;color:var(--text-dim)}
.doc .updated{font-size:12px;color:var(--text-dim);margin-bottom:24px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);padding:12px 24px;background:var(--accent);color:#000;border-radius:8px;font-weight:600;z-index:999;opacity:0;transition:all .3s}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:900px){.layout{flex-direction:column}.form-side{width:100%;position:relative;height:auto;border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>

<div class="layout">
<!-- FORM -->
<div class="form-side">
<h1>⚖️ Legal Docs Generator</h1>
<p>Generate professional legal documents for free</p>

<div class="tabs">
<div class="tab active" data-doc="privacy" onclick="switchTab('privacy')">🔒 Privacy Policy</div>
<div class="tab" data-doc="terms" onclick="switchTab('terms')">📋 Terms of Service</div>
<div class="tab" data-doc="disclaimer" onclick="switchTab('disclaimer')">⚠️ Disclaimer</div>
</div>

<div class="field">
<label>Company / Website Name *</label>
<input type="text" id="f-company" placeholder="My Company Inc." oninput="generate()">
</div>
<div class="field">
<label>Website URL</label>
<input type="text" id="f-url" placeholder="https://mycompany.com" oninput="generate()">
</div>
<div class="field">
<label>Contact Email</label>
<input type="text" id="f-email" placeholder="legal@mycompany.com" oninput="generate()">
</div>

<div id="privacy-fields">
<div class="field">
<label>What data do you collect?</label>
<div class="checkbox-grid">
<label class="checkbox-item"><input type="checkbox" checked onchange="generate()"> Personal info (name, email)</label>
<label class="checkbox-item"><input type="checkbox" checked onchange="generate()"> Usage data (IP, browser)</label>
<label class="checkbox-item"><input type="checkbox" onchange="generate()"> Cookies</label>
<label class="checkbox-item"><input type="checkbox" onchange="generate()"> Location data</label>
<label class="checkbox-item"><input type="checkbox" onchange="generate()"> Payment info</label>
<label class="checkbox-item"><input type="checkbox" checked onchange="generate()"> Communications</label>
</div>
</div>
<div class="field">
<label>Third-party services you use</label>
<div class="checkbox-grid">
<label class="checkbox-item"><input type="checkbox" checked onchange="generate()"> Google Analytics</label>
<label class="checkbox-item"><input type="checkbox" onchange="generate()"> Google Ads</label>
<label class="checkbox-item"><input type="checkbox" checked onchange="generate()"> Email marketing</label>
<label class="checkbox-item"><input type="checkbox" onchange="generate()"> Stripe/PayPal</label>
<label class="checkbox-item"><input type="checkbox" onchange="generate()"> Facebook Pixel</label>
<label class="checkbox-item"><input type="checkbox" onchange="generate()"> Cloudflare</label>
</div>
</div>
</div>

<div id="terms-fields" style="display:none">
<div class="field">
<label>Service Type</label>
<select id="f-service" onchange="generate()">
<option value="website">Website</option>
<option value="saas">SaaS / Web App</option>
<option value="mobile">Mobile App</option>
<option value="ecommerce">E-commerce Store</option>
<option value="marketplace">Marketplace</option>
</select>
</div>
<div class="field">
<label>Do you offer refunds?</label>
<select id="f-refunds" onchange="generate()">
<option value="yes30">Yes — 30 day money back</option>
<option value="yes14">Yes — 14 day money back</option>
<option value="yes7">Yes — 7 day money back</option>
<option value="no">No refunds</option>
<option value="digital">Digital products — no refunds</option>
</select>
</div>
<div class="field">
<label>Minimum user age</label>
<input type="number" id="f-age" value="13" oninput="generate()" style="width:100px">
</div>
</div>

<div id="disclaimer-fields" style="display:none">
<div class="field">
<label>Disclaimer Type</label>
<select id="f-disclaim-type" onchange="generate()">
<option value="general">General Disclaimer</option>
<option value="affiliate">Affiliate Disclosure</option>
<option value="medical">Medical Disclaimer</option>
<option value="financial">Financial Disclaimer</option>
<option value="legal">Legal Disclaimer</option>
</select>
</div>
</div>

<button class="btn btn-green" onclick="copyDoc()">📋 Copy Document</button>
<button class="btn btn-secondary" onclick="downloadDoc()" style="margin-top:8px">⬇️ Download as .html</button>
<p style="font-size:11px;color:var(--text-dim);margin-top:16px;text-align:center">⚠️ This is a template, not legal advice. Have a lawyer review before using.</p>
</div>

<!-- PREVIEW -->
<div class="preview-side">
<div class="preview-header">
<h2 id="preview-title">🔒 Privacy Policy</h2>
<div class="preview-actions">
<button class="btn-sm btn-green" onclick="copyDoc()">📋 Copy</button>
<button class="btn-sm btn-secondary" onclick="downloadDoc()">⬇️ Download</button>
</div>
</div>
<div class="doc" id="doc-output"></div>
</div>
</div>

<div class="toast" id="toast">Copied!</div>

<script>
let activeDoc='privacy';

function switchTab(doc){
activeDoc=doc;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.querySelector('[data-doc="'+doc+'"]').classList.add('active');
document.getElementById('privacy-fields').style.display=doc==='privacy'?'block':'none';
document.getElementById('terms-fields').style.display=doc==='terms'?'block':'none';
document.getElementById('disclaimer-fields').style.display=doc==='disclaimer'?'block':'none';
const titles={privacy:'🔒 Privacy Policy',terms:'📋 Terms of Service',disclaimer:'⚠️ Disclaimer'};
document.getElementById('preview-title').textContent=titles[doc];
generate();
}

function generate(){
const company=document.getElementById('f-company').value||'[Company Name]';
const url=document.getElementById('f-url').value||'[website URL]';
const email=document.getElementById('f-email').value||'[contact email]';
const date=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});

let html='';
if(activeDoc==='privacy')html=genPrivacy(company,url,email,date);
else if(activeDoc==='terms')html=genTerms(company,url,email,date);
else html=genDisclaimer(company,url,email,date);
document.getElementById('doc-output').innerHTML=html;
}

function genPrivacy(company,url,email,date){
return `<h1>Privacy Policy</h1>
<div class="updated">Last updated: ${date}</div>
<p>${company} ("we", "us", or "our") operates ${url} (the "Service"). This page informs you of our policies regarding the collection, use, and disclosure of personal data when you use our Service.</p>

<h2>Information We Collect</h2>
<p>We collect several different types of information for various purposes to provide and improve our Service to you.</p>
<p><strong>Personal Data:</strong> While using our Service, we may ask you to provide us with certain personally identifiable information that can be used to contact or identify you ("Personal Data"). This may include email address, first and last name, phone number, and Cookies.</p>
<p><strong>Usage Data:</strong> We may also collect information on how the Service is accessed and used ("Usage Data"). This may include information such as your computer's Internet Protocol address (e.g. IP address), browser type, browser version, the pages of our Service that you visit, the time and date of your visit, the time spent on those pages, and other statistics.</p>

<h2>Use of Data</h2>
<p>${company} uses the collected data for various purposes:</p>
<p>• To provide and maintain our Service<br>• To notify you about changes to our Service<br>• To allow you to participate in interactive features of our Service when you choose to do so<br>• To provide customer support<br>• To gather analysis or valuable information so that we can improve our Service<br>• To monitor the usage of our Service<br>• To detect, prevent and address technical issues</p>

<h2>Legal Basis for Processing Personal Data</h2>
<p>If you are from the European Economic Area (EEA), ${company}'s legal basis for collecting and using the personal information described in this Privacy Policy depends on the Personal Data we collect and the specific context in which we collect it.</p>

<h2>Retention of Data</h2>
<p>${company} will retain your Personal Data only for as long as is necessary for the purposes set out in this Privacy Policy. We will retain and use your Personal Data to the extent necessary to comply with our legal obligations, resolve disputes, and enforce our policies.</p>

<h2>Transfer of Data</h2>
<p>Your information, including Personal Data, may be transferred to — and maintained on — computers located outside of your state, province, country or other governmental jurisdiction where the data protection laws may differ.</p>

<h2>Disclosure of Data</h2>
<p>${company} may disclose your Personal Data in the good faith belief that such action is necessary to:</p>
<p>• To comply with a legal obligation<br>• To protect and defend the rights or property of ${company}<br>• To prevent or investigate possible wrongdoing in connection with the Service<br>• To protect the personal safety of users of the Service or the public<br>• To protect against legal liability</p>

<h2>Cookies</h2>
<p>We use cookies and similar tracking technologies to track the activity on our Service and hold certain information.</p>

<h2>Your Data Protection Rights</h2>
<p>If you are a resident of the European Economic Area, you have certain data protection rights. ${company} aims to take reasonable steps to allow you to correct, amend, delete, or limit the use of your personal data.</p>
<p>You have the following rights:</p>
<p>• The right to access, update, or delete your data<br>• The right to rectification<br>• The right to object<br>• The right to restriction<br>• The right to data portability<br>• The right to withdraw consent</p>

<h2>Contact Us</h2>
<p>If you have any questions about this Privacy Policy, please contact us at: ${email}</p>`;
}

function genTerms(company,url,email,date){
const service=document.getElementById('f-service').value;
const refunds=document.getElementById('f-refunds').value;
const age=document.getElementById('f-age').value||13;
const refundMap={'yes30':'We offer a 30-day money-back guarantee. If you are not satisfied with our Service, you may request a refund within 30 days of your purchase.','yes14':'We offer a 14-day money-back guarantee.','yes7':'We offer a 7-day money-back guarantee.','no':'All sales are final. No refunds will be provided.','digital':'Due to the nature of digital products, all sales are final and no refunds will be provided.'};

return `<h1>Terms of Service</h1>
<div class="updated">Last updated: ${date}</div>
<p>Welcome to ${company}! These Terms of Service ("Terms", "Terms of Service") govern your use of our ${service} located at ${url} (the "Service").</p>

<h2>Agreement to Terms</h2>
<p>By accessing or using the Service, you agree to be bound by these Terms. If you disagree with any part of the terms, you may not access the Service.</p>

<h2>Use of Service</h2>
<p>You must be at least ${age} years old to use this Service. By using the Service, you represent and warrant that you meet this age requirement.</p>

<h2>Accounts</h2>
<p>When you create an account with us, you must provide information that is accurate, complete, and current at all times. You are responsible for safeguarding the password and for any activities or actions under your account.</p>

<h2>Intellectual Property</h2>
<p>The Service and its original content, features, and functionality are and will remain the exclusive property of ${company} and its licensors. The Service is protected by copyright, trademark, and other laws.</p>

<h2>Refund Policy</h2>
<p>${refundMap[refunds]}</p>

<h2>Links to Other Web Sites</h2>
<p>Our Service may contain links to third-party web sites or services that are not owned or controlled by ${company}. ${company} has no control over and assumes no responsibility for the content, privacy policies, or practices of any third-party web sites or services.</p>

<h2>Termination</h2>
<p>We may terminate or suspend access to our Service immediately, without prior notice or liability, for any reason whatsoever, including without limitation if you breach the Terms.</p>

<h2>Disclaimer</h2>
<p>The information on this website is provided "as is" without any representations or warranties, express or implied. ${company} makes no representations or warranties in relation to this website or the information and materials provided on this website.</p>

<h2>Governing Law</h2>
<p>These Terms shall be governed and construed in accordance with the laws of the jurisdiction where ${company} is registered, without regard to its conflict of law provisions.</p>

<h2>Changes to Terms</h2>
<p>We reserve the right, at our sole discretion, to modify or replace these Terms at any time. If a revision is material, we will try to provide at least 30 days' notice prior to any new terms taking effect.</p>

<h2>Contact Us</h2>
<p>If you have any questions about these Terms, please contact us at: ${email}</p>`;
}

function genDisclaimer(company,url,email,date){
const type=document.getElementById('f-disclaim-type').value;
let body='';
if(type==='general'){
body=`<p>The information provided by ${company} on ${url} is for general informational purposes only. All information on the Site is provided in good faith, however we make no representation or warranty of any kind, express or implied, regarding the accuracy, adequacy, validity, reliability, availability, or completeness of any information on the Site.</p>
<h2>External Links Disclaimer</h2>
<p>The Site may contain links to other websites or content belonging to or originating from third parties. We do not warrant, endorse, or assume responsibility for the accuracy or reliability of any information offered by third-party websites.`;
}else if(type==='affiliate'){
body=`<h2>Affiliate Disclosure</h2>
<p>This disclosure is provided in accordance with the Federal Trade Commission's guidelines. ${company} is a participant in various affiliate programs. This means we may earn commissions on qualifying purchases made through links on our website.</p>
<p>The opinions expressed about products are our own and are not influenced by any affiliate commission we may receive. We only recommend products and services we believe will add value to our readers.`;
}else if(type==='medical'){
body=`<h2>Medical Disclaimer</h2>
<p>The information provided by ${company} is for educational and informational purposes only and is not intended as medical advice. The information is not a substitute for professional medical advice, diagnosis, or treatment.</p>
<p>Always seek the advice of your physician or other qualified health provider with any questions you may have regarding a medical condition. Never disregard professional medical advice or delay in seeking it because of something you have read on this website.`;
}else if(type==='financial'){
body=`<h2>Financial Disclaimer</h2>
<p>The information provided by ${company} is for general informational and educational purposes only and is not a substitute for professional financial advice. All information is provided in good faith, however we make no representation or warranty of any kind.</p>
<p>You should consult with a professional financial advisor before making any financial decisions. ${company} will not be liable for any losses or damages in connection with the use of our website.`;
}else{
body=`<h2>Legal Disclaimer</h2>
<p>The information provided by ${company} is for general informational purposes only and does not constitute legal advice. No attorney-client relationship is formed by your use of this website or our services.</p>
<p>You should consult with a qualified attorney for legal advice regarding your specific situation. ${company} is not responsible for any actions taken based on the information provided on this website.`;
}

return `<h1>Disclaimer</h1>
<div class="updated">Last updated: ${date}</div>
${body}
<h2>Professional Disclaimer</h2>
<p>The Site cannot and does not contain professional advice. The information is provided for general informational and educational purposes only and is not a substitute for professional advice.</p>
<h2>Contact Us</h2>
<p>If you have any questions about this Disclaimer, please contact us at: ${email}</p>`;
}

function copyDoc(){
const text=document.getElementById('doc-output').innerText;
navigator.clipboard.writeText(text).then(()=>{
const t=document.getElementById('toast');
t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),2000);
});
}

function downloadDoc(){
const company=document.getElementById('f-company').value||'company';
const html=`<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>${activeDoc} - ${company}</title>
<style>
body{font-family:Georgia,serif;max-width:800px;margin:40px auto;padding:20px;line-height:1.8;color:#333}
h1{font-size:28px}h2{font-size:20px;margin-top:24px}
</style>
</head>
<body>
${document.getElementById('doc-output').innerHTML.replace(/<div class="updated">/g,'<p style="color:#888;font-size:13px">')}
</body>
</html>`;
const blob=new Blob([html],{type:'text/html'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download=activeDoc+'-'+company.toLowerCase().replace(/\s+/g,'-')+'.html';
a.click();
const t=document.getElementById('toast');
t.textContent='Downloaded!';
t.classList.add('show');
setTimeout(()=>{t.classList.remove('show');t.textContent='Copied!';},2000);
}

generate();
</script>
</body>
</html>
