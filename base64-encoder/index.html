<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 Encoder & Decoder - Free Online Tool | Free Tools</title>
<meta name="description" content="Free online Base64 encoder and decoder. Convert text to Base64 and back instantly with full Unicode support. No signup, 100% private — runs entirely in your browser.">
<style>
:root{--bg:#0a0a12;--surface:#13131f;--primary:#6c5ce7;--accent:#00d4aa;--text:#e0e0e8;--text-dim:#7878a0;--border:#252538}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.container{max-width:800px;width:100%}
h1{text-align:center;font-size:2rem;margin-bottom:8px;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:var(--text-dim);margin-bottom:24px;font-size:0.9rem}
.mode-bar{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.mode-bar button{cursor:pointer;border-radius:10px;padding:10px 20px;font-size:0.9rem;font-weight:600;transition:all 0.2s;background:var(--surface);border:2px solid var(--border);color:var(--text)}
.mode-bar button:hover{border-color:var(--accent)}
.mode-bar button.active{border-color:var(--accent);background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
.field-label{font-size:0.85rem;color:var(--text-dim);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
textarea{width:100%;height:180px;background:var(--surface);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:1rem;padding:16px;resize:vertical;outline:none;font-family:inherit;line-height:1.6}
textarea:focus{border-color:var(--primary)}
textarea[readonly]{background:#0d0d18;cursor:default}
.error{color:#ff6b6b;font-size:0.8rem}
.arrow{text-align:center;margin:14px 0;color:var(--text-dim);font-size:1.4rem}
.toolbar{display:flex;gap:8px;margin-top:16px;justify-content:center;flex-wrap:wrap}
button{cursor:pointer;border:none;border-radius:10px;padding:10px 20px;font-size:0.9rem;font-weight:600;transition:all 0.2s}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
.btn-secondary{background:var(--surface);border:2px solid var(--border);color:var(--text)}
.btn-secondary:hover{border-color:var(--accent)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--accent);color:#000;padding:14px 28px;border-radius:12px;font-weight:600;transition:transform 0.3s;z-index:100}
.toast.show{transform:translateX(-50%) translateY(0)}
.cta{text-align:center;margin-top:20px;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:16px}
.cta a{color:var(--accent);text-decoration:none;font-weight:600}
footer{text-align:center;color:var(--text-dim);margin-top:20px;font-size:0.8rem}
footer a{color:var(--text-dim)}
</style>
</head>
<body>
<div class="container">
<h1>🔐 Base64 Encoder</h1>
<p class="subtitle">Encode text to Base64 or decode it back. Full Unicode support, instant conversion, 100% free.</p>

<div class="mode-bar">
<button id="btn-encode" class="active" onclick="setMode('encode')">⬆️ Encode</button>
<button id="btn-decode" onclick="setMode('decode')">⬇️ Decode</button>
<button class="btn-secondary" onclick="swap()">🔄 Swap</button>
</div>

<div class="field-label"><span id="label-in">Plain Text</span><span class="error" id="err"></span></div>
<textarea id="input" placeholder="Type or paste here..." oninput="convert()"></textarea>

<div class="arrow">⬇</div>

<div class="field-label"><span id="label-out">Base64</span></div>
<textarea id="output" readonly placeholder="Result appears here..."></textarea>

<div class="toolbar">
<button class="btn-primary" onclick="copyOut()">📋 Copy Result</button>
<button class="btn-secondary" onclick="clearAll()">🗑️ Clear</button>
<button class="btn-secondary" onclick="sample()">📝 Sample</button>
</div>

<div class="cta">
<p>🚀 Get <strong>503 AI prompts</strong> to write faster and better</p>
<p style="margin-top:8px"><a href="https://chiefgngs-prog.github.io/promptvault/">Get the AI Prompt Vault →</a></p>
</div>

<footer>
<p>Free Base64 Encoder — No signup, no limits</p>
<p><a href="https://chiefgngs-prog.github.io/freetools/">← More Free Tools</a></p>
</footer>
</div>

<script>
let mode='encode';
function $(id){return document.getElementById(id)}

// Unicode-safe: TextEncoder/TextDecoder round-trip UTF-8 bytes through btoa/atob.
function encode(str){const bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function decode(str){const bin=atob(str.trim());const bytes=new Uint8Array([...bin].map(c=>c.charCodeAt(0)));return new TextDecoder().decode(bytes)}

function setMode(m){mode=m;updateLabels();convert()}
function updateLabels(){
$('btn-encode').classList.toggle('active',mode==='encode');
$('btn-decode').classList.toggle('active',mode==='decode');
$('label-in').textContent=mode==='encode'?'Plain Text':'Base64';
$('label-out').textContent=mode==='encode'?'Base64':'Plain Text';
}

function convert(){
const v=$('input').value,$e=$('err');
try{$e.textContent='';if(v===''){$('output').value='';return;}$('output').value=mode==='encode'?encode(v):decode(v);}
catch(e){$e.textContent='Invalid Base64 — check your input';$('output').value='';}
}

function swap(){const tmp=$('input').value;$('input').value=$('output').value;$('output').value=tmp;mode=mode==='encode'?'decode':'encode';updateLabels();convert()}
function copyOut(){const v=$('output').value;if(!v)return showToast('Nothing to copy');navigator.clipboard.writeText(v);showToast('Copied!')}
function clearAll(){$('input').value='';$('output').value='';$('err').textContent=''}
function sample(){$('input').value=mode==='encode'?'Hello, World! 🌍 — Unicode works!':'SGVsbG8sIFdvcmxkISDwn4yNIC0gVW5pY29kZSB3b3JrcyE=';convert()}

function showToast(msg){const t=$('toast')||document.createElement('div');t.id='toast';t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.classList.add('show'),10);setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},2000)}
</script>
</body>
</html>
